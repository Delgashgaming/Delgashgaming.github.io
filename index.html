<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delgash Gaming PS4 Host</title>
    <style>
        body {
            /* وێنەیێ تە دێ بێتە باکگراوەند و تەواویا شاشەی گریت */
            background-image: linear-gradient(rgba(13, 17, 23, 0.75), rgba(13, 17, 23, 0.75)), url('IMG_1426.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
        }

        h1 {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .subtitle {
            color: #38bdf8;
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .circle-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            background-color: rgba(13, 17, 23, 0.6);
            box-shadow: 0 0 30px #0284c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .circle-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 40px #38bdf8;
        }

        .power-icon {
            width: 50px;
            height: 50px;
            stroke: #38bdf8;
            stroke-width: 8;
            fill: none;
            margin-bottom: 10px;
        }

        .btn-text {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .status {
            color: #38bdf8;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .checkbox-container {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Delgash Gaming<br>PS4 Host</h1>
    <div class="subtitle">by Delgash Gaming</div>

    <div class="circle-btn" onclick="alert('Jailbreak Triggered!')">
        <svg class="power-icon" viewBox="0 0 100 100">
            <path d="M 50,15 L 50,45" stroke-linecap="round"/>
            <path d="M 25,30 A 35,35 0 1,0 75,30" stroke-linecap="round"/>
        </svg>
        <span class="btn-text">JAILBREAK</span>
    </div>

    <div class="status">READY</div>

    <div class="checkbox-container">
        <input type="checkbox" id="autojb">
        <label for="autojb">AUTO JB</label>
    </div>

</body>
</html>
