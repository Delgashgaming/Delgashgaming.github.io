<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delgash Gaming PS4 Host</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #38bdf8;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .circle-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px #0284c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .circle-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px #38bdf8;
        }

        .power-icon {
            width: 50px;
            height: 50px;
            stroke: #38bdf8;
            stroke-width: 8;
            fill: none;
            margin-bottom: 15px;
        }

        .btn-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .status {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        .checkbox-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Delgash Gaming<br>PS4 Host</h1>
    <div class="subtitle">by Delgash Gaming</div>

    <div class="circle-btn" onclick="alert('Jailbreak Triggered!')">
        <svg class="power-icon" viewBox="0 0 100 100">
            <path d="M 50,15 L 50,45" stroke-linecap="round"/>
            <path d="M 25,30 A 35,35 0 1,0 75,30" stroke-linecap="round"/>
        </svg>
        <span class="btn-text">JAILBREAK</span>
    </div>

    <div class="status">READY</div>

    <div class="checkbox-container">
        <input type="checkbox" id="autojb">
        <label for="autojb">AUTO JB</label>
    </div>

</body>
</html>
