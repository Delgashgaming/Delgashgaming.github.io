<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delgashgaming PS4 Host</title>
    <style>
        body {
            background-color: #0f141d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #8b9bb4;
            margin-bottom: 40px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .jb-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #00a2ff;
            background: radial-gradient(circle, #1a2636 0%, #0d131a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .jb-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 162, 255, 0.8);
        }

        .power-icon {
            font-size: 36px;
            margin-bottom: 5px;
            color: #00a2ff;
        }

        .jb-text {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status {
            margin-top: 25px;
            font-size: 14px;
            color: #00a2ff;
            font-weight: bold;
        }

        .auto-jb {
            margin-top: 10px;
            font-size: 12px;
            color: #8b9bb4;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="title">Delgashgaming PS4 Host</div>
    <div class="subtitle">by ntfargo and thanks to him</div>

    <div class="btn-container">
        <div class="jb-button" onclick="load_exploit()">
            <div class="power-icon">⏻</div>
            <div class="jb-text">JAILBREAK</div>
        </div>

        <div class="status" id="console">READY</div>

        <div class="auto-jb">
            <input type="checkbox" id="autojb"> AUTO JB
        </div>
    </div>

    <script>
        function load_exploit() {
            document.getElementById("console").innerHTML = "Triggering Exploit... Please wait!";
            // ل ڤێرێ کۆدێ JavaScript یێ GoldHEN یان Exploit تێتە بارکرن
            setTimeout(function(){
                document.getElementById("console").innerHTML = "GoldHEN Loaded Successfully!";
            }, 3000);
        }
    </script>

</body>
</html>
