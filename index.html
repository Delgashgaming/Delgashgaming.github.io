<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delgash Gaming PS4 Host</title>
<style>
  body {
    background-image: url('https://delgashgaming.github.io/background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .card {
    background: rgba(0, 0, 0, 0.75);
    border: 2px solid #00aaff;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 20px #00aaff;
  }
  h2 { margin-bottom: 5px; }
  p { margin: 5px 0; font-size: 14px; color: #bbb; }
  .jb-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #00aaff;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px #00aaff;
  }
  .jb-btn:hover { background: #00aaff; color: #000; }
  #status { margin-top: 15px; font-weight: bold; color: #00ffcc; }
</style>
</head>
<body>

<div class="card">
  <h2>Delgash-Gaming</h2>
  <p>☎ 0750 427 0137</p>
  <p>☎ 0750 777 9532</p>
  <p>by Delgash Gaming</p>

  <div class="jb-btn" onclick="runJailbreak()">JAILBREAK</div>

  <div id="status">READY</div>
</div>

<script>
function runJailbreak() {
  document.getElementById('status').innerHTML = "Loading GoldHEN...";
  
  // لۆدکردنی فایلی goldhen.bin
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'goldhen.bin', true);
  xhr.responseType = 'arraybuffer';
  xhr.onload = function() {
    if (xhr.status === 200) {
      document.getElementById('status').innerHTML = "GoldHEN Loaded Successfully!";
      // داواکاری بۆ دەستپێکردنی پەیڵۆد
      setTimeout(function(){
        alert("GoldHEN v2.4 Loaded!");
      }, 1000);
    } else {
      document.getElementById('status').innerHTML = "Error: goldhen.bin not found!";
    }
  };
  xhr.onerror = function() {
    document.getElementById('status').innerHTML = "Error loading payload!";
  };
  xhr.send();
}
</script>

</body>
</html>
