<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delgash Gaming PS4 Host</title>
<style>
  body {
    background-image: url('https://delgashgaming.github.io/background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .card {
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #00aaff;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 20px #00aaff;
  }
  h2 { margin-bottom: 5px; color: #fff; }
  p { margin: 5px 0; font-size: 14px; color: #bbb; }
  .jb-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #00aaff;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px #00aaff;
  }
  .jb-btn:hover { background: #00aaff; color: #000; }
  #status { margin-top: 15px; font-weight: bold; color: #00ffcc; }
</style>
</head>
<body>

<div class="card">
  <h2>Delgash-Gaming</h2>
  <p>☎ 0750 427 0137</p>
  <p>☎ 0750 777 9532</p>
  <p>by Delgash Gaming</p>

  <div class="jb-btn" onclick="loadGoldHen()">JAILBREAK</div>

  <div id="status">READY</div>
</div>

<script>
function loadGoldHen() {
  document.getElementById("status").innerHTML = "Loading Exploit...";
  var script = document.createElement("script");
  script.src = "goldhen.bin";
  script.onload = function() {
    document.getElementById("status").innerHTML = "GoldHEN Loaded!";
  };
  script.onerror = function() {
    document.getElementById("status").innerHTML = "Exploit Executed!";
  };
  document.body.appendChild(script);
}
</script>

</body>
</html>
